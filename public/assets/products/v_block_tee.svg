<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE3D8" />
      <stop offset="50%" stop-color="#E2D7C8" />
      <stop offset="100%" stop-color="#D5C7B5" />
    </linearGradient>

    <!-- Wood Hanger Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3A871" />
      <stop offset="50%" stop-color="#C5854C" />
      <stop offset="100%" stop-color="#9C5E29" />
    </linearGradient>

    <!-- Metallic Hook Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#999" />
      <stop offset="50%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#666" />
    </linearGradient>

    <!-- Shirt Shading Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#EFEFEF" />
    </linearGradient>

    <!-- Soft Drop Shadow for Shirt -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#5C4D3C" flood-opacity="0.22" />
    </filter>

    <filter id="hangerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3A2C1E" flood-opacity="0.25" />
    </filter>

    <!-- Clip Path for V Cityscape Graphic -->
    <clipPath id="vClip">
      <path d="M 368 400 L 400 480 L 432 400 L 452 400 L 410 495 L 390 495 L 348 400 Z" />
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1120" fill="url(#bgGrad)" />

  <!-- Background Soft Floor Shadow -->
  <ellipse cx="400" cy="980" rx="280" ry="35" fill="#A89A88" opacity="0.35" filter="blur(15px)" />

  <!-- Top-Left Header: FIBBO APPARELS Vertical Logo -->
  <g transform="translate(50, 45)">
    <!-- Fibbo Diamond Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="18" height="18" fill="none" stroke="#111" stroke-width="2.5" transform="rotate(45 9 9)"/>
      <path d="M5 9 L9 13 L13 5" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Text stacked vertically -->
    <text x="26" y="13" font-family="'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#111">FIBBO</text>
    <text x="26" y="26" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="8" letter-spacing="5" fill="#333">APPARELS</text>
  </g>

  <!-- Top-Right Header: REGULAR FIT -->
  <text x="750" y="75" text-anchor="end" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="2" fill="#888" opacity="0.75">REGULAR FIT</text>

  <!-- Hanger Hook & Body -->
  <g filter="url(#hangerShadow)">
    <!-- Metal Hook -->
    <path d="M 400 180 C 400 130, 420 120, 415 140 C 410 155, 400 160, 400 180" fill="none" stroke="url(#metalGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Wooden Contoured Hanger -->
    <path d="M 400 180 L 320 240 C 310 247, 305 255, 330 252 L 400 242 L 470 252 C 495 255, 490 247, 480 240 Z" fill="url(#woodGrad)" />
    <!-- Metal Neck Joint -->
    <circle cx="400" cy="182" r="5" fill="#666" />
  </g>

  <!-- White T-Shirt Body -->
  <g filter="url(#softShadow)">
    <path d="
      M 345 250 
      Q 400 270 455 250 
      L 505 270 
      L 660 330 
      L 620 480 
      L 570 450 
      L 580 870 
      Q 400 885 220 870 
      L 230 450 
      L 180 480 
      L 140 330 
      L 295 270 
      Z" 
      fill="url(#shirtGrad)" 
      stroke="#E2E2E2" 
      stroke-width="1.5" 
    />

    <!-- Sleeve Seams -->
    <path d="M 295 270 L 230 450" stroke="#E0E0E0" stroke-width="2" fill="none" />
    <path d="M 505 270 L 570 450" stroke="#E0E0E0" stroke-width="2" fill="none" />

    <!-- Crew Neck Collar Ribbing -->
    <path d="M 345 250 Q 400 290 455 250 Q 400 270 345 250 Z" fill="#F4F4F4" stroke="#DCDCDC" stroke-width="2" />
    <path d="M 350 252 Q 400 286 450 252" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Fabric Fold Shading Lines -->
    <path d="M 240 460 Q 280 550 260 650" fill="none" stroke="#000" opacity="0.03" stroke-width="8" filter="blur(4px)" />
    <path d="M 560 460 Q 520 550 540 650" fill="none" stroke="#000" opacity="0.03" stroke-width="8" filter="blur(4px)" opacity="0.03" />
    <path d="M 380 280 Q 400 400 390 550" fill="none" stroke="#000" opacity="0.02" stroke-width="12" filter="blur(6px)" />
  </g>

  <!-- CHEST PRINT DESIGN: BL V CK -->
  <g transform="translate(0, 20)">
    <!-- 'BL' text -->
    <text x="335" y="460" text-anchor="end" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" letter-spacing="6" fill="#111111">BL</text>

    <!-- 'CK' text -->
    <text x="465" y="460" text-anchor="start" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" letter-spacing="6" fill="#111111">CK</text>

    <!-- Outer Frame Brackets around V -->
    <path d="M 350 380 L 350 365 L 375 365" stroke="#111" stroke-width="3" fill="none" />
    <path d="M 450 380 L 450 365 L 425 365" stroke="#111" stroke-width="3" fill="none" />
    <path d="M 350 490 L 350 505 L 375 505" stroke="#111" stroke-width="3" fill="none" />
    <path d="M 450 490 L 450 505 L 425 505" stroke="#111" stroke-width="3" fill="none" />

    <!-- The V block with Cityscape silhouette inside -->
    <g>
      <!-- V Base Solid Outline -->
      <path d="M 365 380 L 400 475 L 435 380 L 455 380 L 412 495 L 388 495 L 345 380 Z" fill="#111" />
      <!-- Cityscape vector inside V clip -->
      <g clip-path="url(#vClip)">
        <rect x="340" y="380" width="120" height="120" fill="#222225" />
        <!-- Skyscrapers & Windows -->
        <rect x="350" y="410" width="15" height="80" fill="#44444A" />
        <rect x="368" y="390" width="22" height="100" fill="#666670" />
        <rect x="393" y="420" width="18" height="70" fill="#333338" />
        <rect x="414" y="400" width="25" height="90" fill="#55555F" />
        <!-- Tiny lit windows -->
        <circle cx="372" cy="405" r="1.5" fill="#FFF" opacity="0.8" />
        <circle cx="378" cy="405" r="1.5" fill="#FFF" opacity="0.8" />
        <circle cx="372" cy="420" r="1.5" fill="#FFF" opacity="0.8" />
        <circle cx="420" cy="415" r="1.5" fill="#FFF" opacity="0.8" />
        <circle cx="426" cy="415" r="1.5" fill="#FFF" opacity="0.8" />
        <circle cx="420" cy="430" r="1.5" fill="#FFF" opacity="0.8" />
      </g>
    </g>

    <!-- Slogan Box below BL V CK -->
    <g transform="translate(400, 535)">
      <!-- Top and Bottom enclosure lines -->
      <path d="M -100 -22 L -100 -30 L 100 -30 L 100 -22" stroke="#111" stroke-width="2" fill="none" />
      <path d="M -100 18 L -100 26 L 100 26 L 100 18" stroke="#111" stroke-width="2" fill="none" />

      <text x="0" y="-12" text-anchor="middle" font-family="'Montserrat', 'Helvetica', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#111">SAY IT IN A CALM WAY</text>
      <text x="0" y="8" text-anchor="middle" font-family="'Montserrat', 'Helvetica', sans-serif" font-weight="800" font-size="13" letter-spacing="4" fill="#111">I AM THE BEST</text>
    </g>
  </g>

  <!-- Bottom-Left Footer Text -->
  <g transform="translate(35, 1050)">
    <text x="0" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="10" letter-spacing="0.5" fill="#444">A CLEAN, VERSATILE EVERYDAY T-SHIRT DESIGNED WITH A COMFORTABLE FIT AND A REFINED LOOK.</text>
    <text x="0" y="16" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="10" letter-spacing="0.5" fill="#444">EASY TO STYLE AND SUITABLE FOR EVERYDAY WEAR</text>
  </g>

  <!-- Bottom-Right Badge: CODE- 250001 -->
  <g transform="translate(650, 1035)">
    <rect x="0" y="0" width="115" height="32" fill="#000000" rx="2" />
    <text x="57.5" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-weight="800" font-size="12" letter-spacing="2" fill="#FFFFFF">CODE- 250001</text>
  </g>
</svg>
